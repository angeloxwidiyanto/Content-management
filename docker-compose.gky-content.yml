# Cadence — content-management.gkykgd.org
#
# Static SPA in its own container on the shared gky network. Caddy terminates
# TLS and proxies here; the portal (gky-internal) is only used as the auth gate.
#
#   docker compose -f docker-compose.gky-content.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gky-content:latest
    container_name: gky-content
    restart: unless-stopped
    # Localhost only, for smoke tests before DNS/Caddy are ready.
    ports:
      - "127.0.0.1:8088:80"
    expose:
      - "80"
    networks:
      gky:
        aliases:
          - gky-content
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  gky:
    external: true
    name: gky-kelapa-gading_default
