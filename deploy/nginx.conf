# Cadence — static SPA behind the GKY internal portal.
#
# Setiap request dicek ke gky-internal:8783/api/auth/gate?module=content:
#   204 -> sesi valid + user punya modul "content"      -> lanjut
#   401 -> belum login                                  -> redirect app.gkykgd.org/login
#   403 -> login tapi modul belum diberikan             -> halaman "belum ada akses"
#
# Cookie gky_session memakai Domain=.gkykgd.org sehingga ikut terkirim ke
# subdomain ini; nginx meneruskannya ke subrequest auth.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $auth_upstream gky-internal:8783;

    # Dipakai healthcheck container; tidak butuh sesi.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Subrequest internal: validasi sesi & akses modul ke portal.
    location = /_auth {
        internal;
        proxy_pass http://$auth_upstream/api/auth/gate?module=content;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /assets/ {
        auth_request /_auth;
        error_page 401 = @login;
        error_page 403 = @forbidden;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @login;
        error_page 403 = @forbidden;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;

        try_files $uri /index.html;
    }

    # Belum punya sesi: satu pintu login di app.gkykgd.org.
    location @login {
        return 302 https://app.gkykgd.org/login?next=https://content-management.gkykgd.org$request_uri;
    }

    # Sudah login tetapi modul "content" belum dicentang untuk user ini.
    location @forbidden {
        default_type text/html;
        return 403 '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akses belum diberikan</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#F8F9FA;color:#111827;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:30rem;padding:2rem;text-align:center}h1{font-size:1.25rem}p{color:#4B5563;line-height:1.6}a{color:#1D4ED8}</style></head><body><main><h1>Akses modul Konten belum diberikan</h1><p>Akun Anda sudah masuk, tetapi belum punya akses ke modul ini. Minta admin mencentang <strong>Konten</strong> di halaman Pengguna &amp; akses.</p><p><a href="https://app.gkykgd.org/">Kembali ke portal</a></p></main></body></html>';
    }
}
